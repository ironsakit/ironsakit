<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: black;
            margin: 0;
        }
        canvas {
            border: 2px solid white;
        }
    </style>
</head>
<body>
    <canvas id="pong" width="800" height="400"></canvas>
    <script>
        const canvas = document.getElementById('pong');
        const context = canvas.getContext('2d');

        // Create the pong paddle (player)
        const paddleWidth = 10;
        const paddleHeight = 100;
        const player = {
            x: 0,
            y: canvas.height / 2 - paddleHeight / 2,
            width: paddleWidth,
            height: paddleHeight,
            color: 'white',
            score: 0
        };

        // Create the AI paddle
        const ai = {
            x: canvas.width - paddleWidth,
            y: canvas.height / 2 - paddleHeight / 2,
            width: paddleWidth,
            height: paddleHeight,
            color: 'white',
            score: 0
        };

        // Create the pong ball
        const ball = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 10,
            speed: 4,
            velocityX: 4,
            velocityY: 4,
            color: 'white'
        };

        // Draw a rectangle
        function drawRect(x, y, width, height, color) {
            context.fillStyle = color;
            context.fillRect(x, y, width, height);
        }

        // Draw the circle
        function drawCircle(x, y, radius, color) {
            context.fillStyle = color;
            context.beginPath();
            context.arc(x, y, radius, 0, Math.PI * 2, false);
            context.closePath();
            context.fill();
        }

        // Draw the text
        function drawText(text, x, y) {
            context.fillStyle = 'white';
            context.font = '45px Fantasy';
            context.fillText(text, x, y);
        }

        // Reset the ball to the center of the canvas
        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.speed = 4;
            ball.velocityX = 4;
            ball.velocityY = 4;
        }

        // Update the canvas
        function update() {
            // Move the paddles
            if (isUpPressed && player.y > 0) {
                player.y -= 8;
            } else if (isDownPressed && (player.y < canvas.height - paddleHeight)) {
                player.y += 8;
            }

            // AI Movement
            if (ai.y + ai.height / 2 < ball.y) {
                ai.y += 4;
            } else {
                ai.y -= 4;
            }

            // Move the ball
            ball.x += ball.velocityX;
            ball.y += ball.velocityY;

            // Ball collision with top and bottom
            if (ball.y + ball.radius >= canvas.height || ball.y - ball.radius <= 0) {
                ball.velocityY = -ball.velocityY;
            }

            // Ball collision with paddles
            if (ball.x - ball.radius <= player.x + player.width && ball.y >= player.y && ball.y <= player.y + player.height) {
                ball.velocityX = -ball.velocityX;
            } else if (ball.x + ball.radius >= ai.x && ball.y >= ai.y && ball.y <= ai.y + ai.height) {
                ball.velocityX = -ball.velocityX;
            }

            // Reset ball if it goes out of bounds
            if (ball.x - ball.radius < 0) {
                ai.score++;  // AI scores
                resetBall();
            } else if (ball.x + ball.radius > canvas.width) {
                player.score++;  // Player scores
                resetBall();
            }
        }

        // Render the game
        function render() {
            // Clear the canvas
            drawRect(0, 0, canvas.width, canvas.height, 'black');
            // Draw paddles and ball
            drawRect(player.x, player.y, player.width, player.height, player.color);
            drawRect(ai.x, ai.y, ai.width, ai.height, ai.color);
            drawCircle(ball.x, ball.y, ball.radius, ball.color);
            // Draw scores
            drawText(player.score, canvas.width / 4, canvas.height / 5);
            drawText(ai.score, 3 * canvas.width / 4, canvas.height / 5);
        }

        // Game loop
        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        // Keyboard events
        let isUpPressed = false;
        let isDownPressed = false;

        window.addEventListener('keydown', (event) => {
            switch (event.key) {
                case 'ArrowUp':
                    isUpPressed = true;
                    break;
                case 'ArrowDown':
                    isDownPressed = true;
                    break;
            }
        });

        window.addEventListener('keyup', (event) => {
            switch (event.key) {
                case 'ArrowUp':
                    isUpPressed = false;
                    break;
                case 'ArrowDown':
                    isDownPressed = false;
                    break;
            }
        });

        // Start the game loop
        gameLoop();
    </script>
</body>
</html>
